name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # A separate job rather than more steps on `build`, for two reasons. It needs a ~170MB browser
  # download that the other gates do not, and Playwright's `webServer` builds for itself — so
  # sharing a job would run `npm run build` twice and serialise work that has no dependency between
  # its halves.
  #
  # What it covers is disjoint rather than additional: jsdom has no layout engine, so scrolling,
  # geometry, coarse-pointer media queries and canvas painting are all unfalsifiable there. One such
  # gap already shipped a bug; see e2e/matrix-scroll.spec.ts.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Keyed on the Playwright version, since that is what decides the browser build.
      - name: Cache browsers
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - name: Install browsers
        # All three declared projects are Chromium — `Desktop Chrome`, `Pixel 5` and the retina
        # variant of `Desktop Chrome` name no channel, so they use the bundled build rather than a
        # system Chrome. `--with-deps` is still run on a cache hit, because it installs system
        # libraries rather than the browser.
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      # Not `if: failure()`. A test that fails once and passes the retry leaves this step green, so
      # a failure-only upload discards the report exactly when a trace exists to read — `trace:
      # 'on-first-retry'` produces one for the flaky case and nothing else. That run is the one
      # worth keeping evidence from, because it is green and the next one may not be.
      - name: Upload the browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          # The report is only written once the run starts; if an earlier step failed there is
          # nothing to upload and that is not itself worth a warning.
          if-no-files-found: ignore
